name: Generate Social Video V28

on:
  workflow_dispatch:
    inputs:
      title: {description: "Nom du produit", required: true}
      current_price: {description: "Prix actuel", required: true}
      original_price: {description: "Ancien prix", required: false}
      discount: {description: "Réduction", required: false}
      image_url: {description: "Image produit", required: false}
      affiliate_url: {description: "Lien affilié", required: true}
  repository_dispatch:
    types: [generate_tiktok]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEAL_TITLE: ${{ github.event.client_payload.title || inputs.title }}
      CURRENT_PRICE: ${{ github.event.client_payload.currentPrice || inputs.current_price }}
      ORIGINAL_PRICE: ${{ github.event.client_payload.originalPrice || inputs.original_price }}
      DISCOUNT: ${{ github.event.client_payload.discount || inputs.discount }}
      IMAGE_URL: ${{ github.event.client_payload.imageUrl || inputs.image_url }}
      AFFILIATE_URL: ${{ github.event.client_payload.affiliateUrl || inputs.affiliate_url }}
      TTS_VOICE: fr-FR-HenriNeural
      TTS_RATE: "+4%"
      TTS_PITCH: "+0Hz"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.2.8
          sudo apt-get update
          sudo apt-get install -y ffmpeg file

      - name: Valider les données
        run: |
          set -euo pipefail
          test -n "${DEAL_TITLE:-}" || (echo "::error::Titre manquant" && exit 1)
          test -n "${CURRENT_PRICE:-}" || (echo "::error::Prix actuel manquant" && exit 1)
          test -n "${AFFILIATE_URL:-}" || (echo "::error::Lien affilié manquant" && exit 1)
          echo "Le deal sera toujours transformé en vidéo, avec ou sans ancien prix."

      - name: Préparer l'image produit
        run: |
          set -euo pipefail
          mkdir -p public
          rm -f public/product-image.jpg public/product-image.svg
          if [ -n "${IMAGE_URL:-}" ] && curl -LfsS --max-time 25 --retry 2 -A "Mozilla/5.0" -o public/product-image.jpg "$IMAGE_URL"; then
            MIME="$(file -b --mime-type public/product-image.jpg || true)"
            [[ "$MIME" == image/* ]] || rm -f public/product-image.jpg
          fi
          if [ ! -s public/product-image.jpg ]; then
            cat > public/product-image.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" rx="80" fill="#111827"/><text x="540" y="500" text-anchor="middle" fill="#ff9900" font-size="80" font-family="Arial" font-weight="900">ALERTE</text><text x="540" y="610" text-anchor="middle" fill="#ffffff" font-size="80" font-family="Arial" font-weight="900">BON PLAN</text></svg>
          SVG
          fi

      - name: Créer props.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const localImage = fs.existsSync('public/product-image.jpg') ? 'product-image.jpg' : 'product-image.svg';
          const verified = Boolean(String(process.env.ORIGINAL_PRICE || '').trim() && String(process.env.DISCOUNT || '').trim());
          const props = {
            title: process.env.DEAL_TITLE || '',
            shortTitle: '',
            currentPrice: process.env.CURRENT_PRICE || '',
            originalPrice: verified ? (process.env.ORIGINAL_PRICE || '') : '',
            discount: verified ? (process.env.DISCOUNT || '') : '',
            imageUrl: localImage,
            affiliateUrl: process.env.AFFILIATE_URL || '',
            format: verified ? 'verified_drop' : 'price_only'
          };
          fs.writeFileSync('props.json', JSON.stringify(props, null, 2));
          console.log(props);
          NODE

      - name: Générer les légendes
        run: |
          python generate_caption.py
          test -s tiktok_caption.txt
          test -s facebook_caption.txt

      - name: Générer la vidéo
        run: >
          npx remotion render
          src/index.jsx
          DealVideo
          video_raw.mp4
          --props=props.json
          --codec=h264
          --crf=14
          --pixel-format=yuv420p
          --audio-codec=aac
          --audio-bitrate=192k
          --concurrency=2

      - name: Finaliser et contrôler
        run: |
          ffmpeg -hide_banner -loglevel warning -y -i video_raw.mp4 \
            -filter:a "loudnorm=I=-15:LRA=7:TP=-1.5,alimiter=limit=0.95" \
            -c:v libx264 -preset medium -crf 15 -profile:v high -level:v 4.1 \
            -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 192k -ar 48000 -ac 2 \
            video_tiktok.mp4
          test -s video_tiktok.mp4
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 video_tiktok.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 video_tiktok.mp4)
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 video_tiktok.mp4)
          echo "Résolution: ${WIDTH}x${HEIGHT} | Durée: ${DURATION}s"
          [ "$WIDTH" = "1080" ] && [ "$HEIGHT" = "1920" ]

      - name: Conserver la vidéo
        uses: actions/upload-artifact@v4
        with:
          name: video-alertebonplan-${{ github.run_number }}
          path: |
            video_tiktok.mp4
            tiktok_caption.txt
            facebook_caption.txt
            props.json
          retention-days: 7
          if-no-files-found: error

      - name: Envoyer la vidéo sur Telegram
        run: |
          set -euo pipefail
          curl --fail-with-body --request POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
            --form "chat_id=${{ secrets.TIKTOK_CHANNEL_ID }}" \
            --form "video=@video_tiktok.mp4" \
            --form "supports_streaming=true" \
            --form-string "caption=🎬 Vidéo prête à publier sur TikTok."

      - name: Envoyer la légende TikTok
        run: |
          CAPTION="$(cat tiktok_caption.txt)"
          curl --fail-with-body --request POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --form "chat_id=${{ secrets.TIKTOK_CHANNEL_ID }}" \
            --form "disable_web_page_preview=true" \
            --form-string "text=${CAPTION}"

      - name: Publier le Réel Facebook
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${FACEBOOK_PAGE_ACCESS_TOKEN:-}" ]; then
            echo "Publication Facebook ignorée : secret absent."
            exit 0
          fi
          GRAPH_VERSION="${FACEBOOK_GRAPH_VERSION:-v25.0}"
          CAPTION="$(cat facebook_caption.txt)"
          START=$(curl -fsS -X POST -G --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" --data-urlencode "upload_phase=start" "https://graph.facebook.com/${GRAPH_VERSION}/me/video_reels")
          VIDEO_ID=$(printf '%s' "$START" | python -c 'import json,sys; print(json.load(sys.stdin)["video_id"])')
          UPLOAD_URL=$(printf '%s' "$START" | python -c 'import json,sys; print(json.load(sys.stdin)["upload_url"])')
          SIZE=$(stat -c%s video_tiktok.mp4)
          curl -fsS -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${FACEBOOK_PAGE_ACCESS_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" -H "Content-Type: application/octet-stream" --data-binary @video_tiktok.mp4 >/dev/null
          curl -fsS -X POST -G --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" --data-urlencode "video_id=${VIDEO_ID}" --data-urlencode "upload_phase=finish" --data-urlencode "video_state=PUBLISHED" --data-urlencode "description=${CAPTION}" "https://graph.facebook.com/${GRAPH_VERSION}/me/video_reels" >/dev/null
          echo "Réel Facebook publié."
