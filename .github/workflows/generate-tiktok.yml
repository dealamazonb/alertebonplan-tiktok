name: Generate Social Video V30

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Titre du produit"
        required: true
        default: "Sac Eastpak Reader M"
      currentPrice:
        description: "Prix actuel"
        required: true
        default: "34,09 €"
      originalPrice:
        description: "Ancien prix vérifié"
        required: false
        default: ""
      discount:
        description: "Réduction vérifiée"
        required: false
        default: ""
      imageUrl:
        description: "URL image produit"
        required: false
        default: ""
      affiliateUrl:
        description: "Lien affilié"
        required: false
        default: ""
      facebookReelCandidate:
        description: "Publier aussi en Reel Facebook"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [generate_tiktok]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Node
        run: npm install

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Préparer les données
        id: prepare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_CURRENT_PRICE: ${{ inputs.currentPrice }}
          INPUT_ORIGINAL_PRICE: ${{ inputs.originalPrice }}
          INPUT_DISCOUNT: ${{ inputs.discount }}
          INPUT_IMAGE_URL: ${{ inputs.imageUrl }}
          INPUT_AFFILIATE_URL: ${{ inputs.affiliateUrl }}
          INPUT_FACEBOOK_REEL_CANDIDATE: ${{ inputs.facebookReelCandidate }}
        run: |
          python - <<'PY'
          import json
          import os

          if os.environ.get("EVENT_NAME") == "repository_dispatch":
              raw = os.environ.get("DISPATCH_PAYLOAD") or "{}"
              props = json.loads(raw)
          else:
              props = {
                  "title": os.environ.get("INPUT_TITLE", ""),
                  "currentPrice": os.environ.get("INPUT_CURRENT_PRICE", ""),
                  "originalPrice": os.environ.get("INPUT_ORIGINAL_PRICE", ""),
                  "discount": os.environ.get("INPUT_DISCOUNT", ""),
                  "imageUrl": os.environ.get("INPUT_IMAGE_URL", ""),
                  "affiliateUrl": os.environ.get("INPUT_AFFILIATE_URL", ""),
                  "facebookReelCandidate":
                      os.environ.get("INPUT_FACEBOOK_REEL_CANDIDATE", "false"),
              }

          raw_candidate = props.get("facebookReelCandidate", False)

          if isinstance(raw_candidate, bool):
              facebook_reel_candidate = raw_candidate
          else:
              facebook_reel_candidate = (
                  str(raw_candidate).strip().lower() == "true"
              )

          props["facebookReelCandidate"] = facebook_reel_candidate

          with open("props.json", "w", encoding="utf-8") as f:
              json.dump(props, f, ensure_ascii=False, indent=2)

          github_output = os.environ.get("GITHUB_OUTPUT")

          if github_output:
              with open(github_output, "a", encoding="utf-8") as output:
                  output.write(
                      "facebook_reel_candidate="
                      + ("true" if facebook_reel_candidate else "false")
                      + "\n"
                  )

          print(json.dumps(props, ensure_ascii=False, indent=2))
          PY

      - name: Préparer l’image produit
        shell: bash
        run: |
          mkdir -p public

          IMAGE_URL=$(python - <<'PY'
          import json
          with open("props.json", "r", encoding="utf-8") as f:
              props = json.load(f)
          print(props.get("imageUrl", ""))
          PY
          )

          echo "URL image : $IMAGE_URL"

          if [ -n "$IMAGE_URL" ]; then
            curl --fail               --location               --retry 3               --retry-delay 2               --connect-timeout 20               --max-time 60               --user-agent "Mozilla/5.0"               "$IMAGE_URL"               --output public/product-image.jpg || true
          fi

          if [ ! -s public/product-image.jpg ]; then
            echo "Image indisponible : création d’une image de secours."
            python - <<'PY'
          from PIL import Image, ImageDraw

          image = Image.new("RGB", (1000, 1000), "white")
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle(
              (60, 60, 940, 940),
              radius=60,
              fill=(245, 247, 250),
              outline=(220, 225, 232),
              width=6,
          )
          draw.text(
              (500, 500),
              "AlerteBonPlan",
              fill=(20, 47, 76),
              anchor="mm",
          )
          image.save("public/product-image.jpg", quality=95)
          PY
          fi

          file public/product-image.jpg
          ls -lh public/product-image.jpg

      - name: Générer les légendes
        run: |
          python generate_caption.py
          test -s tiktok_caption.txt
          test -s facebook_caption.txt

      - name: Générer la vidéo
        run: npx remotion render src/index.jsx DealVideo video_raw.mp4 --props=props.json --codec=h264 --crf=14 --pixel-format=yuv420p --concurrency=2

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Vérifier la vidéo
        run: |
          test -s video_raw.mp4
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            video_raw.mp4

      - name: Conserver la vidéo
        uses: actions/upload-artifact@v4
        with:
          name: alertebonplan-video
          path: |
            video_raw.mp4
            tiktok_caption.txt
            facebook_caption.txt
          retention-days: 7

      - name: Envoyer la vidéo sur Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TIKTOK_CHANNEL_ID: ${{ secrets.TIKTOK_CHANNEL_ID }}
        run: |
          CAPTION=$(cat tiktok_caption.txt)

          curl --fail-with-body \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            --form "chat_id=${TIKTOK_CHANNEL_ID}" \
            --form "video=@video_raw.mp4" \
            --form-string "caption=${CAPTION}" \
            --form "supports_streaming=true"

      - name: Publier le Reel Facebook
        if: steps.prepare.outputs.facebook_reel_candidate == 'true'
        shell: bash
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: "v25.0"
        run: |
          set -euo pipefail

          if [ -z "${FACEBOOK_PAGE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Le secret FACEBOOK_PAGE_ACCESS_TOKEN est manquant."
            exit 1
          fi

          test -s video_raw.mp4
          test -s facebook_caption.txt

          TITLE=$(python - <<'PY'
          import json

          with open("props.json", "r", encoding="utf-8") as f:
              props = json.load(f)

          print(str(props.get("title", "Bon plan Amazon")).strip())
          PY
          )

          DESCRIPTION=$(cat facebook_caption.txt)

          echo "Création de la session Reel Facebook…"

          CREATE_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --get \
            "https://graph.facebook.com/${FACEBOOK_GRAPH_VERSION}/me/video_reels" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            --data-urlencode "upload_phase=start")

          echo "$CREATE_RESPONSE"

          VIDEO_ID=$(printf '%s' "$CREATE_RESPONSE" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)
          value = data.get("video_id")

          if not value:
              raise SystemExit("video_id absent de la réponse Meta")

          print(value)
          ')

          UPLOAD_URL=$(printf '%s' "$CREATE_RESPONSE" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)
          value = data.get("upload_url")

          if not value:
              raise SystemExit("upload_url absente de la réponse Meta")

          print(value)
          ')

          FILE_SIZE=$(stat -c%s video_raw.mp4)

          echo "Envoi de la vidéo vers Meta — ${FILE_SIZE} octets…"

          UPLOAD_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            "$UPLOAD_URL" \
            --header "Authorization: OAuth ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            --header "offset: 0" \
            --header "file_size: ${FILE_SIZE}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@video_raw.mp4")

          echo "$UPLOAD_RESPONSE"

          printf '%s' "$UPLOAD_RESPONSE" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)

          if data.get("success") is not True:
              raise SystemExit("Meta a refusé l’envoi de la vidéo")
          '

          echo "Publication du Reel Facebook…"

          PUBLISH_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --get \
            "https://graph.facebook.com/${FACEBOOK_GRAPH_VERSION}/me/video_reels" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            --data-urlencode "video_id=${VIDEO_ID}" \
            --data-urlencode "upload_phase=finish" \
            --data-urlencode "video_state=PUBLISHED" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "description=${DESCRIPTION}")

          echo "$PUBLISH_RESPONSE"

          printf '%s' "$PUBLISH_RESPONSE" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)

          if data.get("success") is not True:
              raise SystemExit("Meta n’a pas confirmé la publication du Reel")
          '

          echo "Reel Facebook publié — video_id=${VIDEO_ID}"
